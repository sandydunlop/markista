plugins {
	id 'java'
    id 'java-library'
    id 'jacoco'
    id "org.sonarqube" version "6.2.0.5505"
//    id 'signing'
//	id 'maven-publish'
}

group = 'io.github.sandydunlop'
version = '0.1.16'

repositories {
	mavenCentral()
}

dependencies {
	testImplementation(platform('org.junit:junit-bom:5.13.3'))
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    implementation project(':markista')
}

java {
    withJavadocJar()
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_24
    targetCompatibility = JavaVersion.VERSION_24
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
    finalizedBy jacocoTestReport // report is always generated after tests run
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = true
        html.required = true 
    }
}

jacoco {
    toolVersion = "0.8.13"
}

sonar {
  properties {
    property "sonar.projectKey", "sandydunlop_markista"
    property "sonar.organization", "sandydunlop"
    property "sonar.host.url", "https://sonarcloud.io"
  }
}

def user = ["whoami"].execute().text.trim()
jar {
    manifest {
        attributes( 'Main-Class': 'io.github.sandydunlop.markista.doclet.MarkdownDoclet',
                    'Implementation-Title': 'Markista',
                    'Implementation-Version': version,
                    'Implementation-Vendor': group,
                    'Automatic-Module-Name': 'io.github.sandydunlop.markista',
                    'Built-By': "${user}",
                    'Built-Date': new Date())
    }
}

jar.doLast {
    ant.checksum file: archivePath
    // ant.checksum file: archiveFile
}

